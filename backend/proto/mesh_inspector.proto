syntax = "proto3";

package meshinspector;

option cc_generic_services = false;

service MeshInspectorService {
  rpc SubmitMeshJob(SubmitMeshJobRequest) returns (SubmitMeshJobResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (JobStatusResponse);
}

message SubmitMeshJobRequest {
  bytes file_data = 1;
  string filename = 2;
}

message SubmitMeshJobResponse {
  string job_id = 1;
  string status = 2;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;
  double area = 3;
  double volume = 4;
  string error = 5;
}
